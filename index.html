<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wordle auf Deutsch</title>
    
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#e8ebf0" id="theme-meta">
    
    <style>
        /* =========================================
           THEME VARIABLEN (Light & Dark Mode)
           ========================================= */
        :root {
            --bg-color: #e8ebf0;
            --text-color: #1a1a1b;
            --tile-bg: #ffffff;
            --tile-shadow: rgba(0, 0, 0, 0.08);
            --tile-filled-shadow: rgba(0, 0, 0, 0.12);
            --key-bg: #ffffff;
            --key-text: #3c4043;
            --key-shadow: rgba(0, 0, 0, 0.1);
            --key-active: #d3d6da;
            --popup-bg: #ffffff;
            --popup-text: #1a1a1b;
            --absent-bg: linear-gradient(135deg, #9e9e9e, #757575);
            --absent-shadow: rgba(0, 0, 0, 0.2);
        }

        @media (prefers-color-scheme: dark) {
            body:not(.light-theme) {
                --bg-color: #121213;
                --text-color: #ffffff;
                --tile-bg: #1e1e1e;
                --tile-shadow: rgba(0, 0, 0, 0.4);
                --tile-filled-shadow: rgba(0, 0, 0, 0.6);
                --key-bg: #333333;
                --key-text: #ffffff;
                --key-shadow: rgba(0, 0, 0, 0.3);
                --key-active: #555555;
                --popup-bg: #2a2a2a;
                --popup-text: #ffffff;
                --absent-bg: linear-gradient(135deg, #787a7d, #56585b);
                --absent-shadow: rgba(0, 0, 0, 0.4);
            }
        }

        body.dark-theme {
            --bg-color: #121213;
            --text-color: #ffffff;
            --tile-bg: #1e1e1e;
            --tile-shadow: rgba(0, 0, 0, 0.4);
            --tile-filled-shadow: rgba(0, 0, 0, 0.6);
            --key-bg: #333333;
            --key-text: #ffffff;
            --key-shadow: rgba(0, 0, 0, 0.3);
            --key-active: #555555;
            --popup-bg: #2a2a2a;
            --popup-text: #ffffff;
            --absent-bg: linear-gradient(135deg, #787a7d, #56585b);
            --absent-shadow: rgba(0, 0, 0, 0.4);
        }

        body.light-theme {
            --bg-color: #e8ebf0;
            --text-color: #1a1a1b;
            --tile-bg: #ffffff;
            --tile-shadow: rgba(0, 0, 0, 0.08);
            --tile-filled-shadow: rgba(0, 0, 0, 0.12);
            --key-bg: #ffffff;
            --key-text: #3c4043;
            --key-shadow: rgba(0, 0, 0, 0.1);
            --key-active: #d3d6da;
            --popup-bg: #ffffff;
            --popup-text: #1a1a1b;
            --absent-bg: linear-gradient(135deg, #9e9e9e, #757575);
            --absent-shadow: rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color); 
            color: var(--text-color);
            margin: 0; padding: 6vh 0 8vh 0; 
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            height: 100vh; height: 100dvh; overflow: hidden; box-sizing: border-box; width: 100vw;
            transition: background-color 0.4s ease; 
        }

        #flash-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 100; opacity: 0; }
        .flash-win { background-color: rgba(76, 175, 80, 0.85); animation: colorFlood 2.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
        .flash-loss { background-color: rgba(229, 57, 53, 0.9); animation: colorFlood 2.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
        @keyframes colorFlood { 0% { opacity: 1; } 100% { opacity: 0; } }

        #game { display: grid; grid-template-rows: repeat(6, 1fr); gap: 8px; width: 90vw; max-width: 330px; box-sizing: border-box; transition: transform 0.3s; z-index: 10; }
        .board-shake { animation: gentleShake 0.5s ease-in-out; }
        @keyframes gentleShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; }
        .tile { 
            width: 100%; aspect-ratio: 1; border: none; border-radius: 6px; 
            background-color: var(--tile-bg); color: var(--text-color);
            box-shadow: 0 2px 6px var(--tile-shadow); font-size: 2rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s, background-color 0.4s ease, box-shadow 0.4s ease;
            user-select: none; box-sizing: border-box; position: relative;
        }
        .tile.filled { box-shadow: 0 4px 10px var(--tile-filled-shadow); animation: pop 0.2s; }
        .tile.jump { animation: gentleJump 0.6s ease-in-out; z-index: 20; }
        @keyframes gentleJump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        
        .tile.error { background: linear-gradient(135deg, #ef5350, #e53935) !important; color: white !important; box-shadow: 0 3px 8px rgba(229, 57, 53, 0.4) !important; animation: errorShake 0.4s ease; }
        @keyframes errorShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }

        .correct { background: linear-gradient(135deg, #66bb6a, #43a047) !important; color: white !important; box-shadow: 0 3px 8px rgba(67, 160, 71, 0.3) !important; border: none !important; }
        .present { background: linear-gradient(135deg, #ffca28, #f39c12) !important; color: white !important; box-shadow: 0 3px 8px rgba(243, 156, 18, 0.3) !important; border: none !important; }
        .absent { background: var(--absent-bg) !important; color: white !important; box-shadow: 0 2px 5px var(--absent-shadow) !important; border: none !important; }

        #message-wrapper { display: flex; align-items: center; justify-content: center; width: 100%; height: 50px; z-index: 10; }
        #message { 
            background-color: var(--popup-bg); color: var(--popup-text); padding: 12px 20px; border-radius: 8px;
            font-weight: 600; font-size: 1.1rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease, background-color 0.4s ease, color 0.4s ease; transform: translateY(10px);
        }
        #message.show { opacity: 1; transform: translateY(0); }

        #keyboard { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 480px; padding: 0 6px; box-sizing: border-box; z-index: 10; }
        .keyboard-row { display: flex; justify-content: center; margin-bottom: 6px; width: 100%; gap: 4px; }
        .key { 
            flex: 1; border: none; border-radius: 5px; background-color: var(--key-bg); box-shadow: 0 2px 5px var(--key-shadow);
            cursor: pointer; font-size: 1.25rem; font-weight: 500; color: var(--key-text); height: 44px; 
            display: flex; align-items: center; justify-content: center;
            transition: background-color 0.3s ease, transform 0.1s, box-shadow 0.1s;
            -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box;
        }
        .key:active { background-color: var(--key-active); transform: scale(0.96); box-shadow: 0 1px 2px var(--key-shadow); }
        .key.special { background-color: var(--key-bg); flex: 1.5; }
        .key svg { width: 24px; height: 24px; }

        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* =========================================
           SNAKE EASTER EGG STYLES
           ========================================= */
        #snake-controls {
            display: none; 
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 50px);
            gap: 12px;
            justify-content: center;
            width: 100%;
            height: 144px; 
            z-index: 10;
        }
        .snake-key {
            border: none; border-radius: 8px; background-color: var(--key-bg); box-shadow: 0 4px 10px var(--key-shadow);
            cursor: pointer; color: var(--key-text);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s, background-color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .snake-key svg { width: 28px; height: 28px; }
        .snake-key:active { background-color: var(--key-active); transform: scale(0.92); box-shadow: 0 1px 2px var(--key-shadow); }
        .sk-up { grid-column: 2; grid-row: 1; }
        .sk-left { grid-column: 1; grid-row: 2; }
        .sk-down { grid-column: 2; grid-row: 2; }
        .sk-right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>
    <div id="flash-overlay"></div>
    <div id="game"></div>
    <div id="message-wrapper">
        <div id="message"></div>
    </div>
    
    <div id="keyboard"></div>
    
    <div id="snake-controls">
        <button class="snake-key sk-up" data-dir="up">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
        <button class="snake-key sk-left" data-dir="left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button>
        <button class="snake-key sk-down" data-dir="down">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        </button>
        <button class="snake-key sk-right" data-dir="right">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
    </div>
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js', { scope: './' }).catch(err => console.log(err));
        }

        const game = document.getElementById("game");
        const keyboard = document.getElementById("keyboard");
        const messageElement = document.getElementById("message");
        const flashOverlay = document.getElementById("flash-overlay");

        let TARGET_WORDS = []; 
        let WORDS = []; 
        let targetWord = '';
        
        let currentRow = 0;
        let currentCol = 0;
        let gameOver = false;
        let guesses = ["", "", "", "", "", ""];
        let usedLetters = {};
        let isReady = false;

        let tileSequence = [];
        const SECRET_SEQUENCE = [1, 2, 3, 7, 12]; 

        // =========================================
        // SNAKE VARIABLEN
        // =========================================
        let isSnakeMode = false;
        let snakeInterval;
        let snake = [];
        let snakeDir = { x: 0, y: 0 }; 
        let nextSnakeDir = { x: 0, y: 0 }; 
        let snakeFood = null;
        let snakeWord = "";

        function triggerVibration(pattern) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        const icons = {
            backspace: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"></path><line x1="16" y1="9" x2="10" y2="15"></line><line x1="10" y1="9" x2="16" y2="15"></line></svg>`,
            enter: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 10 4 15 9 20"></polyline><path d="M20 4v7a4 4 0 0 1-4 4H4"></path></svg>`
        };

        function showMessage(msg, duration = 2000) {
            messageElement.textContent = msg;
            messageElement.classList.add("show");
            if (duration > 0) setTimeout(() => messageElement.classList.remove("show"), duration);
        }

        function updateMetaThemeColor() {
            const body = document.body;
            const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            let isDark = isSystemDark;
            if (body.classList.contains('dark-theme')) isDark = true;
            if (body.classList.contains('light-theme')) isDark = false;
            
            const metaTheme = document.getElementById('theme-meta');
            if(metaTheme) metaTheme.setAttribute('content', isDark ? '#121213' : '#e8ebf0');
        }

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateMetaThemeColor);

        function toggleTheme() {
            const body = document.body;
            const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            let isCurrentlyDark = isSystemDark;
            if (body.classList.contains('dark-theme')) isCurrentlyDark = true;
            if (body.classList.contains('light-theme')) isCurrentlyDark = false;

            if (isCurrentlyDark) {
                body.classList.remove('dark-theme');
                body.classList.add('light-theme');
            } else {
                body.classList.remove('light-theme');
                body.classList.add('dark-theme');
            }
            updateMetaThemeColor();
            triggerVibration([30, 50, 30]);
            showMessage(isCurrentlyDark ? "Light Mode aktiviert ☀️" : "Dark Mode aktiviert 🌙", 2000);
        }

        function handleTileClick(index) {
            if (isSnakeMode) return; 
            const now = Date.now();
            tileSequence.push({ index: index, time: now });
            tileSequence = tileSequence.filter(click => now - click.time < 2000);
            if (tileSequence.length > 5) tileSequence.shift();
            if (tileSequence.length === 5 && tileSequence.every((val, i) => val.index === SECRET_SEQUENCE[i])) {
                toggleTheme();
                tileSequence = []; 
            }
        }

        function triggerWinAnimation(row) {
            triggerVibration([50, 50, 50, 50, 100, 50, 200]);
            flashOverlay.className = "flash-win";
            for (let i = 0; i < 5; i++) {
                setTimeout(() => row.children[i].classList.add("jump"), i * 100); 
            }
        }

        function triggerLossAnimation() {
            triggerVibration([200, 100, 300]);
            flashOverlay.className = "flash-loss";
            game.classList.add("board-shake");
        }

        function buildUI() {
            game.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                const row = document.createElement("div");
                row.className = "row";
                for (let j = 0; j < 5; j++) {
                    const tile = document.createElement("div");
                    tile.className = "tile";
                    const index = i * 5 + j;
                    tile.addEventListener("pointerdown", () => handleTileClick(index));
                    row.appendChild(tile);
                }
                game.appendChild(row);
            }

            const layout = [
                ['q', 'w', 'e', 'r', 't', 'z', 'u', 'i', 'o', 'p', 'ü'],
                ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'ö', 'ä'],
                ['y', 'x', 'c', 'v', 'b', 'n', 'm', 'ß', 'backspace', 'enter']
            ];

            keyboard.innerHTML = '';
            layout.forEach(row => {
                const keyboardRow = document.createElement('div');
                keyboardRow.className = 'keyboard-row';
                row.forEach(key => {
                    const btn = document.createElement('button');
                    btn.className = 'key';
                    if (key === 'enter') {
                        btn.innerHTML = icons.enter;
                        btn.classList.add('special', 'enter');
                    } else if (key === 'backspace') {
                        btn.innerHTML = icons.backspace;
                        btn.classList.add('special', 'backspace');
                    } else {
                        btn.textContent = (key === 'ß') ? 'ß' : key.toUpperCase();
                    }
                    
                    btn.dataset.key = key; 
                    
                    btn.addEventListener('pointerdown', (e) => {
                        e.preventDefault(); 
                        handleKey(key);
                    });
                    
                    keyboardRow.appendChild(btn);
                });
                keyboard.appendChild(keyboardRow);
            });
        }

        // =========================================
        // WÖRTER LADEN & SPEICHERN (ANTI-WIEDERHOLUNG MAX 20)
        // =========================================
        function pickNewWord() {
            let playedWords = JSON.parse(localStorage.getItem('wordlePlayedWords')) || [];
            
            // Filter: Alle Wörter nehmen, die NICHT in den letzten 20 gespielten sind
            let availableWords = TARGET_WORDS.filter(w => !playedWords.includes(w));
            
            // Backup, falls (theoretisch) weniger als 20 Wörter insgesamt im System existieren
            if (availableWords.length === 0) {
                availableWords = TARGET_WORDS;
            }
            
            targetWord = availableWords[Math.floor(Math.random() * availableWords.length)];
        }

        function savePlayedWord(word) {
            let playedWords = JSON.parse(localStorage.getItem('wordlePlayedWords')) || [];
            
            // Das aktuelle Wort aus der Liste entfernen (falls es dort schon mal stand) ...
            playedWords = playedWords.filter(w => w !== word);
            
            // ... und ans Ende setzen, damit es als "am neuesten gespielt" gilt
            playedWords.push(word);
            
            // Liste auf maximal die letzten 20 Wörter beschneiden
            if (playedWords.length > 20) {
                playedWords = playedWords.slice(-20);
            }
            
            localStorage.setItem('wordlePlayedWords', JSON.stringify(playedWords));
        }

        updateMetaThemeColor();
        buildUI();
        showMessage("Wörter werden geladen...", 0);

        // Lädt die eigene target-words.json
        setTimeout(() => {
            Promise.all([
                fetch('./target-words.json').then(res => res.json()),
                fetch('https://raw.githubusercontent.com/Jonny-exe/German-Words-Library/master/German-words-1600000-words.json').then(res => res.json())
            ])
            .then(([smallData, largeData]) => {
                TARGET_WORDS = smallData.map(w => w.toLowerCase());
                let externalWords = largeData.filter(w => w.length === 5 && /^[a-zäöüß]+$/i.test(w)).map(w => w.toLowerCase());
                
                WORDS = Array.from(new Set([...externalWords, ...TARGET_WORDS]));
                
                pickNewWord();
                
                isReady = true;
                messageElement.classList.remove("show");
            })
            .catch(err => {
                showMessage("Fehler beim Laden der Wörter!", 0);
                console.error(err);
            });
        }, 100);

        document.addEventListener("keydown", (e) => {
            if (isSnakeMode) {
                if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "w", "a", "s", "d"].includes(e.key)) {
                    e.preventDefault(); 
                }
                switch(e.key) {
                    case "ArrowUp": case "w": case "W": setSnakeDir(0, -1); break;
                    case "ArrowDown": case "s": case "S": setSnakeDir(0, 1); break;
                    case "ArrowLeft": case "a": case "A": setSnakeDir(-1, 0); break;
                    case "ArrowRight": case "d": case "D": setSnakeDir(1, 0); break;
                }
                return;
            }
            
            if (gameOver || !isReady) return;
            const key = e.key;
            if (key === "Backspace") handleKey('backspace');
            else if (key === "Enter") handleKey('enter');
            else if (/^[a-zäöüß]$/i.test(key)) handleKey(key.toLowerCase());
        });

        document.getElementById('snake-controls').addEventListener('pointerdown', (e) => {
            const btn = e.target.closest('.snake-key');
            if (!btn) return;
            e.preventDefault();
            const dir = btn.dataset.dir;
            if (dir === 'up') setSnakeDir(0, -1);
            if (dir === 'down') setSnakeDir(0, 1);
            if (dir === 'left') setSnakeDir(-1, 0);
            if (dir === 'right') setSnakeDir(1, 0);
        });

        function setSnakeDir(dx, dy) {
            if (snakeDir.x !== 0 || snakeDir.y !== 0) {
                if (snake.length > 1 && snakeDir.x === -dx && snakeDir.y === -dy) return;
            }
            nextSnakeDir = { x: dx, y: dy };
        }

        function handleKey(key) {
            if (gameOver || !isReady || isSnakeMode) return;
            const row = game.children[currentRow];

            triggerVibration(8); 

            if (key === 'backspace') {
                if (currentCol > 0) {
                    currentCol--;
                    row.children[currentCol].textContent = "";
                    row.children[currentCol].classList.remove("filled");
                    guesses[currentRow] = guesses[currentRow].slice(0, -1);
                }
            } else if (key === 'enter') {
                if (currentCol === 5) submitGuess();
            } else if (/^[a-zäöüß]$/i.test(key) && currentCol < 5) {
                const tile = row.children[currentCol];
                tile.textContent = (key === 'ß') ? 'ß' : key.toUpperCase();
                tile.classList.add("filled");
                guesses[currentRow] += key.toLowerCase();
                currentCol++;
            }
        }

        function updateKeyColor(letter, status) {
            let keyBtn = document.querySelector(`[data-key="${letter.toLowerCase()}"]`);
            if (!keyBtn) return;

            const currentStatus = usedLetters[letter];
            if (!currentStatus) {
                usedLetters[letter] = status;
            } else if (currentStatus === 'correct') {
                return;
            } else if (currentStatus === 'present' && status === 'correct') {
                usedLetters[letter] = status; 
            } else if (currentStatus === 'absent') {
                usedLetters[letter] = status;
            }

            keyBtn.classList.remove("correct", "present", "absent");
            keyBtn.classList.add(usedLetters[letter]);
        }

        function submitGuess() {
            const guess = guesses[currentRow];
            const row = game.children[currentRow];
            
            // SNAKE TRIGGER
            if (guess === 'snake') {
                startSnakeGame();
                return;
            }
            
            if (!WORDS.includes(guess)) {
                triggerVibration([20, 30, 20]); 
                row.classList.add("board-shake");
                for (let i = 0; i < 5; i++) row.children[i].classList.add("error");
                
                setTimeout(() => {
                    row.classList.remove("board-shake");
                    for (let i = 0; i < 5; i++) row.children[i].classList.remove("error");
                }, 500); 
                showMessage("Wort nicht in Liste");
                return;
            }

            const targetLetters = targetWord.split("");
            const guessLetters = guess.split("");
            const status = Array(5).fill('absent');

            for (let i = 0; i < 5; i++) {
                if (guessLetters[i] === targetLetters[i]) {
                    status[i] = 'correct';
                    targetLetters[i] = null;
                }
            }
            
            for (let i = 0; i < 5; i++) {
                if (status[i] !== 'correct' && targetLetters.includes(guessLetters[i])) {
                    status[i] = 'present';
                    targetLetters[targetLetters.indexOf(guessLetters[i])] = null;
                }
            }

            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    row.children[i].classList.add(status[i]);
                    updateKeyColor(guessLetters[i], status[i]); 
                    
                    if (i === 4) {
                        if (guess === targetWord) { 
                            gameOver = true; 
                            savePlayedWord(targetWord); 
                            triggerWinAnimation(row);
                            showMessage("Genial!", 0);
                            setTimeout(() => document.body.addEventListener('click', resetGame), 500);
                        }
                        else if (currentRow === 5) { 
                            gameOver = true;
                            savePlayedWord(targetWord); 
                            triggerLossAnimation();
                            let displayTarget = targetWord.toUpperCase();
                            if(targetWord.includes('ß')) displayTarget = targetWord.replace(/ß/gi, 'ß');
                            showMessage(displayTarget, 0); 
                            setTimeout(() => document.body.addEventListener('click', resetGame), 500);
                        }
                        else { 
                            currentRow++; 
                            currentCol = 0; 
                        }
                    }
                }, i * 200);
            }
        }

        function resetGame() {
            document.body.removeEventListener('click', resetGame);
            
            currentRow = 0;
            currentCol = 0;
            gameOver = false;
            guesses = ["", "", "", "", "", ""];
            usedLetters = {};
            
            pickNewWord(); 
            
            flashOverlay.className = "";
            game.classList.remove("board-shake");

            const tiles = document.querySelectorAll('.tile');
            tiles.forEach(tile => {
                tile.textContent = '';
                tile.className = 'tile';
                tile.classList.remove('jump', 'error');
            });
            
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => {
                key.classList.remove('correct', 'present', 'absent');
            });
            
            messageElement.classList.remove("show");
        }

        function resetSnakeToNormal() {
            document.body.removeEventListener('click', resetSnakeToNormal);
            isSnakeMode = false;
            document.getElementById('keyboard').style.display = 'flex';
            document.getElementById('snake-controls').style.display = 'none';
            resetGame(); 
        }

        // =========================================
        // SNAKE SPIELLOGIK
        // =========================================
        function startSnakeGame() {
            isSnakeMode = true;
            document.getElementById('keyboard').style.display = 'none';
            document.getElementById('snake-controls').style.display = 'grid';

            snakeWord = targetWord; 
            snake = [{ x: 2, y: 2 }];
            snakeDir = { x: 0, y: 0 };
            nextSnakeDir = { x: 0, y: 0 };
            
            clearBoardUI();
            placeFood();
            showMessage("SNAKE!", 1500);
            renderSnakeUI();
            
            snakeInterval = setInterval(snakeLoop, 400); 
        }

        function clearBoardUI() {
            const tiles = document.querySelectorAll('.tile');
            tiles.forEach(tile => {
                tile.textContent = '';
                tile.className = 'tile'; 
            });
        }

        function placeFood() {
            let emptySpots = [];
            for (let y = 0; y < 6; y++) {
                for (let x = 0; x < 5; x++) {
                    if (!snake.some(s => s.x === x && s.y === y)) {
                        emptySpots.push({ x, y });
                    }
                }
            }
            if (emptySpots.length > 0) {
                snakeFood = emptySpots[Math.floor(Math.random() * emptySpots.length)];
            }
        }

        function snakeLoop() {
            if (nextSnakeDir.x === 0 && nextSnakeDir.y === 0) return; 

            snakeDir = nextSnakeDir;
            const head = snake[0];
            const nextHead = { x: head.x + snakeDir.x, y: head.y + snakeDir.y };

            if (nextHead.x < 0 || nextHead.x > 4 || nextHead.y < 0 || nextHead.y > 5) {
                return endGameSnake(false);
            }
            if (snake.some(s => s.x === nextHead.x && s.y === nextHead.y)) {
                return endGameSnake(false);
            }

            snake.unshift(nextHead);

            if (nextHead.x === snakeFood.x && nextHead.y === snakeFood.y) {
                triggerVibration([20, 30, 20]);
                
                if (snake.length === 5) { 
                    renderSnakeUI();
                    clearInterval(snakeInterval);
                    startSnakeAlignment();
                    return;
                } else {
                    placeFood();
                }
            } else {
                snake.pop(); 
                triggerVibration(5); 
            }

            renderSnakeUI();
        }

        function getAlignmentPath(startSnake) {
            let q = [ { s: startSnake, moves: [] } ];
            let headQ = 0;
            let visited = new Set();
            
            let stateToKey = (s) => s.map(p => `${p.x},${p.y}`).join('|');
            visited.add(stateToKey(startSnake));
            
            let dirs = [ {x:0, y:-1}, {x:0, y:1}, {x:-1, y:0}, {x:1, y:0} ];
            
            while(headQ < q.length) {
                let curr = q[headQ++];
                
                for (let r = 0; r < 6; r++) {
                    if (curr.s[0].x === 0 && curr.s[0].y === r &&
                        curr.s[1].x === 1 && curr.s[1].y === r &&
                        curr.s[2].x === 2 && curr.s[2].y === r &&
                        curr.s[3].x === 3 && curr.s[3].y === r &&
                        curr.s[4].x === 4 && curr.s[4].y === r) {
                        return { moves: curr.moves, row: r };
                    }
                }
                
                for (let d of dirs) {
                    let nx = curr.s[0].x + d.x;
                    let ny = curr.s[0].y + d.y;
                    
                    if (nx < 0 || nx > 4 || ny < 0 || ny > 5) continue;
                    
                    let collision = false;
                    for (let i = 0; i < curr.s.length - 1; i++) {
                        if (curr.s[i].x === nx && curr.s[i].y === ny) {
                            collision = true; break;
                        }
                    }
                    if (collision) continue;
                    
                    let nextS = [{x: nx, y: ny}];
                    for(let i = 0; i < curr.s.length - 1; i++) {
                        nextS.push({x: curr.s[i].x, y: curr.s[i].y});
                    }
                    
                    let key = stateToKey(nextS);
                    if (!visited.has(key)) {
                        visited.add(key);
                        q.push({ s: nextS, moves: [...curr.moves, {x: nx, y: ny}] });
                    }
                }
            }
            return null;
        }

        function startSnakeAlignment() {
            let alignResult = getAlignmentPath(snake);
            
            if (alignResult && alignResult.moves.length > 0) {
                let moves = alignResult.moves;
                snakeInterval = setInterval(() => {
                    if (moves.length > 0) {
                        let nextPos = moves.shift();
                        snake.unshift(nextPos);
                        snake.pop(); 
                        triggerVibration(10);
                        renderSnakeUI();
                    } else {
                        clearInterval(snakeInterval);
                        finishSnakeWin(alignResult.row); 
                    }
                }, 120); 
            } else {
                let finalRow = alignResult ? alignResult.row : 2;
                if (!alignResult) {
                    snake = [{x:0, y:2}, {x:1, y:2}, {x:2, y:2}, {x:3, y:2}, {x:4, y:2}];
                    renderSnakeUI();
                }
                finishSnakeWin(finalRow);
            }
        }

        function finishSnakeWin(rowIdx) {
            savePlayedWord(snakeWord); 
            triggerWinAnimation(game.children[rowIdx]); 
            showMessage("Genial!", 0); 
            
            setTimeout(() => {
                document.body.addEventListener('click', resetSnakeToNormal);
            }, 500);
        }

        function renderSnakeUI() {
            clearBoardUI();
            
            if (snakeFood && snake.length < 5) {
                const foodTile = game.children[snakeFood.y].children[snakeFood.x];
                let letter = snakeWord[snake.length];
                foodTile.textContent = (letter === 'ß') ? 'ß' : letter.toUpperCase();
                foodTile.classList.add("present", "filled", "jump"); 
            }

            snake.forEach((part, index) => {
                const tile = game.children[part.y].children[part.x];
                let letter = snakeWord[index];
                tile.textContent = (letter === 'ß') ? 'ß' : letter.toUpperCase();
                tile.classList.add("correct", "filled");
            });
        }

        function endGameSnake(won) {
            clearInterval(snakeInterval);
            if (!won) { 
                savePlayedWord(snakeWord); 
                triggerVibration([200, 100, 300]);
                flashOverlay.className = "flash-loss";
                game.classList.add("board-shake");
                
                let displayWord = snakeWord.toUpperCase().replace(/ß/gi, 'ß');
                showMessage(displayWord, 0); 
                
                setTimeout(() => {
                    document.body.addEventListener('click', resetSnakeToNormal);
                }, 500);
            }
        }
    </script>
</body>
