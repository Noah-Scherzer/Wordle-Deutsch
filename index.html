<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wordle auf Deutsch</title>
    
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#e8ebf0" id="theme-meta">
    
    <style>
        :root {
            --bg-color: #e8ebf0;
            --text-color: #1a1a1b;
            --tile-bg: #ffffff;
            --tile-shadow: rgba(0, 0, 0, 0.08);
            --tile-filled-shadow: rgba(0, 0, 0, 0.12);
            --key-bg: #ffffff;
            --key-text: #3c4043;
            --key-shadow: rgba(0, 0, 0, 0.1);
            --key-active: #d3d6da;
            --popup-bg: #ffffff;
            --popup-text: #1a1a1b;
            --absent-bg: linear-gradient(135deg, #9e9e9e, #757575);
            --absent-shadow: rgba(0, 0, 0, 0.2);
        }

        @media (prefers-color-scheme: dark) {
            body:not(.light-theme) {
                --bg-color: #121213;
                --text-color: #ffffff;
                --tile-bg: #1e1e1e;
                --tile-shadow: rgba(0, 0, 0, 0.4);
                --tile-filled-shadow: rgba(0, 0, 0, 0.6);
                --key-bg: #333333;
                --key-text: #ffffff;
                --key-shadow: rgba(0, 0, 0, 0.3);
                --key-active: #555555;
                --popup-bg: #2a2a2a;
                --popup-text: #ffffff;
                --absent-bg: linear-gradient(135deg, #4b4c4f, #2f3032);
                --absent-shadow: rgba(0, 0, 0, 0.4);
            }
        }

        body.dark-theme {
            --bg-color: #121213;
            --text-color: #ffffff;
            --tile-bg: #1e1e1e;
            --tile-shadow: rgba(0, 0, 0, 0.4);
            --tile-filled-shadow: rgba(0, 0, 0, 0.6);
            --key-bg: #333333;
            --key-text: #ffffff;
            --key-shadow: rgba(0, 0, 0, 0.3);
            --key-active: #555555;
            --popup-bg: #2a2a2a;
            --popup-text: #ffffff;
            --absent-bg: linear-gradient(135deg, #4b4c4f, #2f3032);
            --absent-shadow: rgba(0, 0, 0, 0.4);
        }

        body.light-theme {
            --bg-color: #e8ebf0;
            --text-color: #1a1a1b;
            --tile-bg: #ffffff;
            --tile-shadow: rgba(0, 0, 0, 0.08);
            --tile-filled-shadow: rgba(0, 0, 0, 0.12);
            --key-bg: #ffffff;
            --key-text: #3c4043;
            --key-shadow: rgba(0, 0, 0, 0.1);
            --key-active: #d3d6da;
            --popup-bg: #ffffff;
            --popup-text: #1a1a1b;
            --absent-bg: linear-gradient(135deg, #9e9e9e, #757575);
            --absent-shadow: rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color); 
            color: var(--text-color);
            margin: 0; padding: 6vh 0 8vh 0; 
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            height: 100vh; height: 100dvh; overflow: hidden; box-sizing: border-box;
            transition: background-color 0.4s ease;
        }

        #game { display: grid; grid-template-rows: repeat(6, 1fr); gap: 8px; width: 90vw; max-width: 330px; }
        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .tile { 
            width: 100%; aspect-ratio: 1; border-radius: 6px; background-color: var(--tile-bg);
            box-shadow: 0 2px 6px var(--tile-shadow); font-size: 2rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
        }
        .tile.filled { box-shadow: 0 4px 10px var(--tile-filled-shadow); animation: pop 0.2s; }
        .correct { background: linear-gradient(135deg, #66bb6a, #43a047) !important; color: white !important; }
        .present { background: linear-gradient(135deg, #ffca28, #f39c12) !important; color: white !important; }
        .absent { background: var(--absent-bg) !important; color: white !important; }
        
        #message-wrapper { height: 50px; display: flex; align-items: center; justify-content: center; }
        #message { 
            background-color: var(--popup-bg); color: var(--popup-text); padding: 12px 20px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); opacity: 0; transition: 0.3s;
        }
        #message.show { opacity: 1; }

        #keyboard { width: 100%; max-width: 480px; padding: 0 6px; }
        .keyboard-row { display: flex; justify-content: center; margin-bottom: 6px; gap: 4px; }
        .key { 
            flex: 1; height: 44px; border: none; border-radius: 5px; background-color: var(--key-bg);
            color: var(--key-text); box-shadow: 0 2px 5px var(--key-shadow); font-size: 1.2rem;
        }

        #flash-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; opacity: 0; }
        .flash-win { background-color: rgba(76, 175, 80, 0.8); animation: flood 2s forwards; }
        .flash-loss { background-color: rgba(229, 57, 53, 0.8); animation: flood 2s forwards; }
        @keyframes flood { 0% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes pop { 50% { transform: scale(1.1); } }
        .tile.jump { animation: jump 0.6s ease-in-out; }
        @keyframes jump { 50% { transform: translateY(-15px); } }
        .board-shake { animation: shake 0.5s; }
        @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    </style>
</head>
<body>
    <div id="flash-overlay"></div>
    <div id="game"></div>
    <div id="message-wrapper"><div id="message"></div></div>
    <div id="keyboard"></div>

    <script>
        const game = document.getElementById("game");
        const keyboard = document.getElementById("keyboard");
        const messageElement = document.getElementById("message");
        const flashOverlay = document.getElementById("flash-overlay");

        let WORDS = [], targetWord = '', currentRow = 0, currentCol = 0, gameOver = false, guesses = ["","","","","",""], usedLetters = {}, isReady = false;
        let tileSequence = [];
        const SECRET = [1, 2, 3, 7, 12];

        function triggerVibration(p) { if (navigator.vibrate) navigator.vibrate(p); }

        function showMessage(m, d = 2000) {
            messageElement.textContent = m;
            messageElement.classList.add("show");
            if (d > 0) setTimeout(() => messageElement.classList.remove("show"), d);
        }

        function toggleTheme() {
            const b = document.body;
            const isDark = b.classList.contains('dark-theme') || (!b.classList.contains('light-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) { b.classList.remove('dark-theme'); b.classList.add('light-theme'); }
            else { b.classList.remove('light-theme'); b.classList.add('dark-theme'); }
            triggerVibration([30, 50, 30]);
            showMessage(b.classList.contains('dark-theme') ? "Dark Mode 🌙" : "Light Mode ☀️");
        }

        function handleKey(key) {
            if (gameOver || !isReady) return;
            triggerVibration(8);
            const row = game.children[currentRow];
            if (key === 'backspace') {
                if (currentCol > 0) { currentCol--; row.children[currentCol].textContent = ""; guesses[currentRow] = guesses[currentRow].slice(0, -1); }
            } else if (key === 'enter') {
                if (currentCol === 5) submitGuess();
            } else if (currentCol < 5) {
                row.children[currentCol].textContent = (key === 'ß') ? 'ß' : key.toUpperCase();
                row.children[currentCol].classList.add("filled");
                guesses[currentRow] += key.toLowerCase();
                currentCol++;
            }
        }

        function submitGuess() {
            const guess = guesses[currentRow];
            if (!WORDS.includes(guess)) {
                triggerVibration([20, 30, 20]);
                const row = game.children[currentRow];
                row.classList.add("board-shake");
                setTimeout(() => row.classList.remove("board-shake"), 500);
                showMessage("Wort nicht in Liste");
                return;
            }
            const row = game.children[currentRow];
            const target = targetWord.split("");
            const status = Array(5).fill('absent');
            const gArr = guess.split("");

            for(let i=0; i<5; i++) if(gArr[i] === target[i]) { status[i] = 'correct'; target[i] = null; }
            for(let i=0; i<5; i++) if(status[i] !== 'correct' && target.includes(gArr[i])) { status[i] = 'present'; target[target.indexOf(gArr[i])] = null; }

            for(let i=0; i<5; i++) {
                setTimeout(() => {
                    row.children[i].classList.add(status[i]);
                    if (i === 4) {
                        if (guess === targetWord) { 
                            gameOver = true; flashOverlay.className = "flash-win"; triggerVibration([50,100,50]);
                            for(let j=0; j<5; j++) setTimeout(() => row.children[j].classList.add("jump"), j*100);
                            showMessage("Genial!", 0);
                        } else if (currentRow === 5) {
                            gameOver = true; flashOverlay.className = "flash-loss"; triggerVibration(200);
                            game.classList.add("board-shake");
                            showMessage(targetWord.toUpperCase(), 0);
                        } else { currentRow++; currentCol = 0; }
                    }
                }, i * 200);
            }
        }

        // UI SOFORT BAUEN
        function build() {
            game.innerHTML = "";
            for (let i = 0; i < 6; i++) {
                const row = document.createElement("div"); row.className = "row";
                for (let j = 0; j < 5; j++) {
                    const tile = document.createElement("div"); tile.className = "tile";
                    const idx = i * 5 + j;
                    tile.addEventListener("pointerdown", () => {
                        const now = Date.now();
                        tileSequence.push({idx, time: now});
                        tileSequence = tileSequence.filter(c => now - c.time < 3000);
                        if (tileSequence.length === 5 && tileSequence.every((v, k) => v.idx === SECRET[k])) toggleTheme();
                    });
                    row.appendChild(tile);
                }
                game.appendChild(row);
            }
            const keys = [['q','w','e','r','t','z','u','i','o','p','ü'],['a','s','d','f','g','h','j','k','l','ö','ä'],['y','x','c','v','b','n','m','ß','backspace','enter']];
            keyboard.innerHTML = "";
            const icons = {
                backspace: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:24px"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"></path><path d="M18 9l-6 6M12 9l6 6"></path></svg>`,
                enter: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:24px"><polyline points="9 10 4 15 9 20"></polyline><path d="M20 4v7a4 4 0 0 1-4 4H4"></path></svg>`
            };
            keys.forEach(r => {
                const div = document.createElement("div"); div.className = "keyboard-row";
                r.forEach(k => {
                    const b = document.createElement("button"); b.className = "key";
                    if(k === 'backspace' || k === 'enter') { b.innerHTML = icons[k]; b.style.flex = "1.5"; }
                    else b.textContent = k === 'ß' ? 'ß' : k.toUpperCase();
                    b.addEventListener("pointerdown", (e) => { e.preventDefault(); handleKey(k); });
                    div.appendChild(b);
                });
                keyboard.appendChild(div);
            });
        }

        build();
        showMessage("Lade Wörter...", 0);

        setTimeout(() => {
            fetch('https://raw.githubusercontent.com/Jonny-exe/German-Words-Library/master/German-words-1600000-words.json')
                .then(r => r.json())
                .then(d => {
                    WORDS = d.filter(w => w.length === 5 && /^[a-zäöüß]+$/i.test(w)).map(w => w.toLowerCase());
                    targetWord = WORDS[Math.floor(Math.random() * WORDS.length)];
                    isReady = true; messageElement.classList.remove("show");
                });
        }, 200);
    </script>
</body>
</html>
