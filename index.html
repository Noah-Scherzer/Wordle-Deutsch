<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wordle auf Deutsch</title>
    
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#e8ebf0" id="theme-meta">
    
    <style>
        /* =========================================
           THEME VARIABLEN (Light & Dark Mode)
           ========================================= */
        :root {
            --bg-color: #e8ebf0;
            --text-color: #1a1a1b;
            --tile-bg: #ffffff;
            --tile-shadow: rgba(0, 0, 0, 0.08);
            --tile-filled-shadow: rgba(0, 0, 0, 0.12);
            --key-bg: #ffffff;
            --key-text: #3c4043;
            --key-shadow: rgba(0, 0, 0, 0.1);
            --key-active: #d3d6da;
            --popup-bg: #ffffff;
            --popup-text: #1a1a1b;
            --absent-bg: linear-gradient(135deg, #9e9e9e, #757575);
            --absent-shadow: rgba(0, 0, 0, 0.2);
        }

        @media (prefers-color-scheme: dark) {
            body:not(.light-theme) {
                --bg-color: #121213;
                --text-color: #ffffff;
                --tile-bg: #1e1e1e;
                --tile-shadow: rgba(0, 0, 0, 0.4);
                --tile-filled-shadow: rgba(0, 0, 0, 0.6);
                --key-bg: #333333;
                --key-text: #ffffff;
                --key-shadow: rgba(0, 0, 0, 0.3);
                --key-active: #555555;
                --popup-bg: #2a2a2a;
                --popup-text: #ffffff;
                --absent-bg: linear-gradient(135deg, #4b4c4f, #2f3032);
                --absent-shadow: rgba(0, 0, 0, 0.4);
            }
        }

        body.dark-theme {
            --bg-color: #121213;
            --text-color: #ffffff;
            --tile-bg: #1e1e1e;
            --tile-shadow: rgba(0, 0, 0, 0.4);
            --tile-filled-shadow: rgba(0, 0, 0, 0.6);
            --key-bg: #333333;
            --key-text: #ffffff;
            --key-shadow: rgba(0, 0, 0, 0.3);
            --key-active: #555555;
            --popup-bg: #2a2a2a;
            --popup-text: #ffffff;
            --absent-bg: linear-gradient(135deg, #4b4c4f, #2f3032);
            --absent-shadow: rgba(0, 0, 0, 0.4);
        }

        body.light-theme {
            --bg-color: #e8ebf0;
            --text-color: #1a1a1b;
            --tile-bg: #ffffff;
            --tile-shadow: rgba(0, 0, 0, 0.08);
            --tile-filled-shadow: rgba(0, 0, 0, 0.12);
            --key-bg: #ffffff;
            --key-text: #3c4043;
            --key-shadow: rgba(0, 0, 0, 0.1);
            --key-active: #d3d6da;
            --popup-bg: #ffffff;
            --popup-text: #1a1a1b;
            --absent-bg: linear-gradient(135deg, #9e9e9e, #757575);
            --absent-shadow: rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color); 
            color: var(--text-color);
            margin: 0; padding: 6vh 0 8vh 0; 
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            height: 100vh; height: 100dvh; overflow: hidden; box-sizing: border-box; width: 100vw;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        #flash-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 100; opacity: 0; }
        .flash-win { background-color: rgba(76, 175, 80, 0.85); animation: colorFlood 2.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
        .flash-loss { background-color: rgba(229, 57, 53, 0.9); animation: colorFlood 2.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
        @keyframes colorFlood { 0% { opacity: 1; } 100% { opacity: 0; } }

        #game { display: grid; grid-template-rows: repeat(6, 1fr); gap: 8px; width: 90vw; max-width: 330px; box-sizing: border-box; transition: transform 0.3s; z-index: 10; }
        .board-shake { animation: gentleShake 0.5s ease-in-out; }
        @keyframes gentleShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; }
        .tile { 
            width: 100%; aspect-ratio: 1; border: none; border-radius: 6px; 
            background-color: var(--tile-bg); color: var(--text-color);
            box-shadow: 0 2px 6px var(--tile-shadow); font-size: 2rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s, background-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
            user-select: none; box-sizing: border-box; position: relative;
        }
        .tile.filled { box-shadow: 0 4px 10px var(--tile-filled-shadow); animation: pop 0.2s; }
        .tile.jump { animation: gentleJump 0.6s ease-in-out; z-index: 20; }
        @keyframes gentleJump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        
        .tile.error { background: linear-gradient(135deg, #ef5350, #e53935) !important; color: white !important; box-shadow: 0 3px 8px rgba(229, 57, 53, 0.4) !important; animation: errorShake 0.4s ease; }
        @keyframes errorShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }

        /* Globale Status-Klassen für Kacheln UND Tasten */
        .correct { background: linear-gradient(135deg, #66bb6a, #43a047) !important; color: white !important; box-shadow: 0 3px 8px rgba(67, 160, 71, 0.3) !important; border: none !important; }
        .present { background: linear-gradient(135deg, #ffca28, #f39c12) !important; color: white !important; box-shadow: 0 3px 8px rgba(243, 156, 18, 0.3) !important; border: none !important; }
        .absent { background: var(--absent-bg) !important; color: white !important; box-shadow: 0 2px 5px var(--absent-shadow) !important; border: none !important; }

        #message-wrapper { display: flex; align-items: center; justify-content: center; width: 100%; height: 50px; z-index: 10; }
        #message { 
            background-color: var(--popup-bg); color: var(--popup-text); padding: 12px 20px; border-radius: 8px;
            font-weight: 600; font-size: 1.1rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease, background-color 0.4s ease, color 0.4s ease; transform: translateY(10px);
        }
        #message.show { opacity: 1; transform: translateY(0); }

        #keyboard { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 480px; padding: 0 6px; box-sizing: border-box; z-index: 10; }
        .keyboard-row { display: flex; justify-content: center; margin-bottom: 6px; width: 100%; gap: 4px; }
        .key { 
            flex: 1; border: none; border-radius: 5px; background-color: var(--key-bg); box-shadow: 0 2px 5px var(--key-shadow);
            cursor: pointer; font-size: 1.25rem; font-weight: 500; color: var(--key-text); height: 44px; 
            display: flex; align-items: center; justify-content: center;
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.1s, box-shadow 0.1s;
            -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box;
        }
        .key:active { background-color: var(--key-active); transform: scale(0.96); box-shadow: 0 1px 2px var(--key-shadow); }
        .key.special { background-color: var(--key-bg); flex: 1.5; }
        .key svg { width: 24px; height: 24px; }

        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div id="flash-overlay"></div>
    <div id="game"></div>
    <div id="message-wrapper">
        <div id="message"></div>
    </div>
    <div id="keyboard"></div>
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js', { scope: './' }).catch(err => console.log(err));
        }

        const game = document.getElementById("game");
        const keyboard = document.getElementById("keyboard");
        const messageElement = document.getElementById("message");
        const flashOverlay = document.getElementById("flash-overlay");

        let WORDS = [];
        let targetWord = '';
        let currentRow = 0;
        let currentCol = 0;
        let gameOver = false;
        let guesses = ["", "", "", "", "", ""];
        let usedLetters = {};
        let isReady = false;

        let tileSequence = [];
        const SECRET_SEQUENCE = [1, 2, 3, 7, 12]; 

        function triggerVibration(pattern) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        const icons = {
            backspace: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"></path><line x1="16" y1="9" x2="10" y2="15"></line><line x1="10" y1="9" x2="16" y2="15"></line></svg>`,
            enter: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 10 4 15 9 20"></polyline><path d="M20 4v7a4 4 0 0 1-4 4H4"></path></svg>`
        };

        function showMessage(msg, duration = 2000) {
            messageElement.textContent = msg;
            messageElement.classList.add("show");
            if (duration > 0) setTimeout(() => messageElement.classList.remove("show"), duration);
        }

        function updateMetaThemeColor() {
            const body = document.body;
            const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            let isDark = isSystemDark;
            if (body.classList.contains('dark-theme')) isDark = true;
            if (body.classList.contains('light-theme')) isDark = false;
            
            const metaTheme = document.getElementById('theme-meta');
            if(metaTheme) metaTheme.setAttribute('content', isDark ? '#121213' : '#e8ebf0');
        }

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateMetaThemeColor);

        function toggleTheme() {
            const body = document.body;
            const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            let isCurrentlyDark = isSystemDark;
            if (body.classList.contains('dark-theme')) isCurrentlyDark = true;
            if (body.classList.contains('light-theme')) isCurrentlyDark = false;

            if (isCurrentlyDark) {
                body.classList.remove('dark-theme');
                body.classList.add('light-theme');
            } else {
                body.classList.remove('light-theme');
                body.classList.add('dark-theme');
            }
            updateMetaThemeColor();
            triggerVibration([30, 50, 30]);
            showMessage(isCurrentlyDark ? "Light Mode aktiviert ☀️" : "Dark Mode aktiviert 🌙", 2000);
        }

        function handleTileClick(index) {
            const now = Date.now();
            tileSequence.push({ index: index, time: now });
            tileSequence = tileSequence.filter(click => now - click.time < 2000);
            if (tileSequence.length > 5) tileSequence.shift();
            if (tileSequence.length === 5 && tileSequence.every((val, i) => val.index === SECRET_SEQUENCE[i])) {
                toggleTheme();
                tileSequence = []; 
            }
        }

        function triggerWinAnimation(row) {
            triggerVibration([50, 50, 50, 50, 100, 50, 200]);
            flashOverlay.className = "flash-win";
            for (let i = 0; i < 5; i++) {
                setTimeout(() => row.children[i].classList.add("jump"), i * 100); 
            }
        }

        function triggerLossAnimation() {
            triggerVibration([200, 100, 300]);
            flashOverlay.className = "flash-loss";
            game.classList.add("board-shake");
        }

        function buildUI() {
            game.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                const row = document.createElement("div");
                row.className = "row";
                for (let j = 0; j < 5; j++) {
                    const tile = document.createElement("div");
                    tile.className = "tile";
                    const index = i * 5 + j;
                    tile.addEventListener("pointerdown", () => handleTileClick(index));
                    row.appendChild(tile);
                }
                game.appendChild(row);
            }

            const layout = [
                ['q', 'w', 'e', 'r', 't', 'z', 'u', 'i', 'o', 'p', 'ü'],
                ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'ö', 'ä'],
                ['y', 'x', 'c', 'v', 'b', 'n', 'm', 'ß', 'backspace', 'enter']
            ];

            keyboard.innerHTML = '';
            layout.forEach(row => {
                const keyboardRow = document.createElement('div');
                keyboardRow.className = 'keyboard-row';
                row.forEach(key => {
                    const btn = document.createElement('button');
                    btn.className = 'key';
                    if (key === 'enter') {
                        btn.innerHTML = icons.enter;
                        btn.classList.add('special', 'enter');
                    } else if (key === 'backspace') {
                        btn.innerHTML = icons.backspace;
                        btn.classList.add('special', 'backspace');
                    } else {
                        btn.textContent = (key === 'ß') ? 'ß' : key.toUpperCase();
                    }
                    
                    // WICHTIG: Das 'data-key' Attribut für die Tastatur-Farben
                    btn.dataset.key = key; 
                    
                    btn.addEventListener('pointerdown', (e) => {
                        e.preventDefault(); 
                        handleKey(key);
                    });
                    
                    keyboardRow.appendChild(btn);
                });
                keyboard.appendChild(keyboardRow);
            });
        }

        updateMetaThemeColor();
        buildUI();
        showMessage("Wörter werden geladen...", 0);

        setTimeout(() => {
            fetch('https://raw.githubusercontent.com/Jonny-exe/German-Words-Library/master/German-words-1600000-words.json')
                .then(res => res.json())
                .then(data => {
                    WORDS = data.filter(w => w.length === 5 && /^[a-zäöüß]+$/i.test(w)).map(w => w.toLowerCase());
                    targetWord = WORDS[Math.floor(Math.random() * WORDS.length)];
                    isReady = true;
                    messageElement.classList.remove("show");
                })
                .catch(err => showMessage("Fehler beim Laden der Wörter!", 0));
        }, 100);

        document.addEventListener("keydown", (e) => {
            if (gameOver || !isReady) return;
            const key = e.key;
            if (key === "Backspace") handleKey('backspace');
            else if (key === "Enter") handleKey('enter');
            else if (/^[a-zäöüß]$/i.test(key)) handleKey(key.toLowerCase());
        });

        function handleKey(key) {
            if (gameOver || !isReady) return;
            const row = game.children[currentRow];

            triggerVibration(8); 

            if (key === 'backspace') {
                if (currentCol > 0) {
                    currentCol--;
                    row.children[currentCol].textContent = "";
                    row.children[currentCol].classList.remove("filled");
                    guesses[currentRow] = guesses[currentRow].slice(0, -1);
                }
            } else if (key === 'enter') {
                if (currentCol === 5) submitGuess();
            } else if (/^[a-zäöüß]$/i.test(key) && currentCol < 5) {
                const tile = row.children[currentCol];
                tile.textContent = (key === 'ß') ? 'ß' : key.toUpperCase();
                tile.classList.add("filled");
                guesses[currentRow] += key.toLowerCase();
                currentCol++;
            }
        }

        // NEU HINZUGEFÜGT: Tastatur-Farben updaten
        function updateKeyColor(letter, status) {
            let keyBtn = document.querySelector(`[data-key="${letter.toLowerCase()}"]`);
            if (!keyBtn) return;

            const currentStatus = usedLetters[letter];
            if (!currentStatus) {
                usedLetters[letter] = status;
            } else if (currentStatus === 'correct') {
                return; // Grün bleibt Grün
            } else if (currentStatus === 'present' && status === 'correct') {
                usedLetters[letter] = status; // Gelb wird zu Grün
            } else if (currentStatus === 'absent') {
                usedLetters[letter] = status;
            }

            keyBtn.classList.remove("correct", "present", "absent");
            keyBtn.classList.add(usedLetters[letter]);
        }

        function submitGuess() {
            const guess = guesses[currentRow];
            const row = game.children[currentRow];
            
            if (!WORDS.includes(guess)) {
                triggerVibration([20, 30, 20]); 
                row.classList.add("board-shake");
                for (let i = 0; i < 5; i++) row.children[i].classList.add("error");
                
                setTimeout(() => {
                    row.classList.remove("board-shake");
                    for (let i = 0; i < 5; i++) row.children[i].classList.remove("error");
                }, 500); 
                showMessage("Wort nicht in Liste");
                return;
            }

            const targetLetters = targetWord.split("");
            const guessLetters = guess.split("");
            const status = Array(5).fill('absent');

            for (let i = 0; i < 5; i++) {
                if (guessLetters[i] === targetLetters[i]) {
                    status[i] = 'correct';
                    targetLetters[i] = null;
                }
            }
            
            for (let i = 0; i < 5; i++) {
                if (status[i] !== 'correct' && targetLetters.includes(guessLetters[i])) {
                    status[i] = 'present';
                    targetLetters[targetLetters.indexOf(guessLetters[i])] = null;
                }
            }

            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    row.children[i].classList.add(status[i]);
                    updateKeyColor(guessLetters[i], status[i]); // Tasten einfärben
                    
                    if (i === 4) {
                        if (guess === targetWord) { 
                            gameOver = true; 
                            triggerWinAnimation(row);
                            showMessage("Genial!", 0);
                            setTimeout(() => document.body.addEventListener('click', resetGame), 500);
                        }
                        else if (currentRow === 5) { 
                            gameOver = true; 
                            triggerLossAnimation();
                            let displayTarget = targetWord.toUpperCase();
                            if(targetWord.includes('ß')) displayTarget = targetWord.replace(/ß/gi, 'ß');
                            showMessage(displayTarget, 0); 
                            setTimeout(() => document.body.addEventListener('click', resetGame), 500);
                        }
                        else { 
                            currentRow++; 
                            currentCol = 0; 
                        }
                    }
                }, i * 200);
            }
        }

        // NEU HINZUGEFÜGT: Reset-Funktion für einen Neustart
        function resetGame() {
            document.body.removeEventListener('click', resetGame);
            
            currentRow = 0;
            currentCol = 0;
            gameOver = false;
            guesses = ["", "", "", "", "", ""];
            usedLetters = {};
            targetWord = WORDS[Math.floor(Math.random() * WORDS.length)];
            
            flashOverlay.className = "";
            game.classList.remove("board-shake");

            const tiles = document.querySelectorAll('.tile');
            tiles.forEach(tile => {
                tile.textContent = '';
                tile.className = 'tile';
                tile.classList.remove('jump', 'error');
            });
            
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => {
                key.classList.remove('correct', 'present', 'absent');
            });
            
            messageElement.classList.remove("show");
        }
    </script>
</body>
</html>
