<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wordle auf Deutsch</title>
    
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#e8ebf0">
    
    <style>
        /* Modernes Soft-Lightmode UI */
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #e8ebf0; 
            color: #1a1a1b;
            margin: 0;
            padding: 6vh 0 8vh 0; /* 8vh Abstand nach unten */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            box-sizing: border-box;
            width: 100vw;
        }

        /* Intensives Farb-Fluten für Sieg/Niederlage (bleibt!) */
        #flash-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none; 
            z-index: 100;
            opacity: 0;
        }
        
        .flash-win {
            background-color: rgba(76, 175, 80, 0.85); /* Sattes, leuchtendes Grün */
            animation: colorFlood 2.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        .flash-loss {
            background-color: rgba(229, 57, 53, 0.9); /* Tiefes, dramatisches Rot */
            animation: colorFlood 2.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        @keyframes colorFlood {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        #game {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 8px; 
            width: 90vw;
            max-width: 330px;
            box-sizing: border-box;
            transition: transform 0.3s;
            z-index: 10;
        }

        /* Sanftes Wackeln beim Verlieren */
        .board-shake {
            animation: gentleShake 0.5s ease-in-out;
        }
        @keyframes gentleShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 100%;
        }

        .tile {
            width: 100%;
            aspect-ratio: 1;
            border: none; 
            border-radius: 6px; 
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08); 
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            transition: transform 0.2s, background 0.3s, box-shadow 0.2s;
            user-select: none;
            box-sizing: border-box;
            position: relative;
        }

        .tile.filled { 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12); 
            animation: pop 0.2s; 
        }

        /* Sanfter La-Ola Hüpfer beim Gewinnen */
        .tile.jump {
            animation: gentleJump 0.6s ease-in-out;
            z-index: 20;
        }
        @keyframes gentleJump {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Roter Gradient für falsche Wörter (während Eingabe) */
        .tile.error {
            background: linear-gradient(135deg, #ef5350, #e53935) !important; 
            color: white !important; 
            box-shadow: 0 3px 8px rgba(229, 57, 53, 0.4) !important; 
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        /* Edle Lightmode Gradients für richtige/vorhandene Buchstaben */
        .correct { 
            background: linear-gradient(135deg, #66bb6a, #43a047) !important; 
            color: white !important; 
            box-shadow: 0 3px 8px rgba(67, 160, 71, 0.3) !important; 
        }
        .present { 
            background: linear-gradient(135deg, #ffca28, #f39c12) !important; 
            color: white !important; 
            box-shadow: 0 3px 8px rgba(243, 156, 18, 0.3) !important;
        }
        .absent { 
            background: linear-gradient(135deg, #9e9e9e, #757575) !important; 
            color: white !important; 
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2) !important;
        }

        /* Wrapper für Popups */
        #message-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50px; 
            z-index: 10;
        }

        #message {
            background-color: #ffffff;
            color: #1a1a1b;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateY(10px);
        }
        
        #message.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Keyboard */
        #keyboard {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 480px;
            padding: 0 6px;
            box-sizing: border-box;
            z-index: 10;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            margin-bottom: 6px;
            width: 100%;
            gap: 4px;
        }

        .key {
            flex: 1;
            border: none;
            border-radius: 5px;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            font-size: 1.25rem;
            font-weight: 500;
            color: #3c4043;
            height: 44px; 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.1s, transform 0.1s, box-shadow 0.1s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            box-sizing: border-box;
        }

        .key:active { 
            background-color: #d3d6da; 
            transform: scale(0.96); 
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1); 
        }

        /* Sondertasten in Weiß */
        .key.special {
            background-color: #ffffff; 
            flex: 1.5;
        }

        .key svg {
            width: 24px;
            height: 24px;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="flash-overlay"></div>

    <div id="game"></div>
    
    <div id="message-wrapper">
        <div id="message"></div>
    </div>
    
    <div id="keyboard"></div>
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js', { scope: './' }).catch(err => console.log(err));
        }

        const game = document.getElementById("game");
        const keyboard = document.getElementById("keyboard");
        const messageElement = document.getElementById("message");
        const flashOverlay = document.getElementById("flash-overlay");

        let WORDS = [];
        let targetWord = '';
        let currentRow = 0;
        let currentCol = 0;
        let gameOver = false;
        let guesses = ["", "", "", "", "", ""];
        let usedLetters = {};
        let isReady = false;

        function triggerVibration(pattern) {
            if (navigator.vibrate) {
                navigator.vibrate(pattern);
            }
        }

        // Outline Icons (exakt wie Gboard Screenshot)
        const icons = {
            backspace: `<svg viewBox="0 0 24 24" fill="none" stroke="#3c4043" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"></path><line x1="16" y1="9" x2="10" y2="15"></line><line x1="10" y1="9" x2="16" y2="15"></line></svg>`,
            enter: `<svg viewBox="0 0 24 24" fill="none" stroke="#3c4043" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 10 4 15 9 20"></polyline><path d="M20 4v7a4 4 0 0 1-4 4H4"></path></svg>`
        };

        function showMessage(msg, duration = 2000) {
            messageElement.textContent = msg;
            messageElement.classList.add("show");
            if (duration > 0) {
                setTimeout(() => messageElement.classList.remove("show"), duration);
            }
        }

        function triggerWinAnimation(row) {
            // Fröhliches Tadaa-Vibrationsmuster
            triggerVibration([50, 50, 50, 50, 100, 50, 200]);
            
            // Intensives grünes Aufleuchten
            flashOverlay.className = "flash-win";

            // Sanfte La-Ola Welle
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    row.children[i].classList.add("jump");
                }, i * 100); 
            }
        }

        function triggerLossAnimation() {
            // Schweres Vibrationsmuster
            triggerVibration([200, 100, 300]);
            
            // Intensives rotes Aufleuchten
            flashOverlay.className = "flash-loss";
            
            // Sanftes Kopfschütteln des Boards
            game.classList.add("board-shake");
        }

        function buildUI() {
            game.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                const row = document.createElement("div");
                row.className = "row";
                for (let j = 0; j < 5; j++) {
                    const tile = document.createElement("div");
                    tile.className = "tile";
                    row.appendChild(tile);
                }
                game.appendChild(row);
            }

            const layout = [
                ['q', 'w', 'e', 'r', 't', 'z', 'u', 'i', 'o', 'p', 'ü'],
                ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'ö', 'ä'],
                ['y', 'x', 'c', 'v', 'b', 'n', 'm', 'ß', 'backspace', 'enter']
            ];

            keyboard.innerHTML = '';
            layout.forEach(row => {
                const keyboardRow = document.createElement('div');
                keyboardRow.className = 'keyboard-row';
                row.forEach(key => {
                    const btn = document.createElement('button');
                    btn.className = 'key';
                    if (key === 'enter') {
                        btn.innerHTML = icons.enter;
                        btn.classList.add('special', 'enter');
                    } else if (key === 'backspace') {
                        btn.innerHTML = icons.backspace;
                        btn.classList.add('special', 'backspace');
                    } else {
                        btn.textContent = (key === 'ß') ? 'ß' : key.toUpperCase();
                    }
                    btn.dataset.key = key;
                    
                    btn.addEventListener('pointerdown', (e) => {
                        e.preventDefault(); 
                        handleKey(key);
                    });
                    
                    keyboardRow.appendChild(btn);
                });
                keyboard.appendChild(keyboardRow);
            });
        }

        // ZUERST die UI komplett laden
        buildUI();
        showMessage("Wörter werden geladen...", 0);

        // Dann mit kleiner Verzögerung die Wortliste laden (verhindert weißes Bild beim Start)
        setTimeout(() => {
            fetch('https://raw.githubusercontent.com/Jonny-exe/German-Words-Library/master/German-words-1600000-words.json')
                .then(res => res.json())
                .then(data => {
                    WORDS = data.filter(w => w.length === 5 && /^[a-zäöüß]+$/i.test(w)).map(w => w.toLowerCase());
                    targetWord = WORDS[Math.floor(Math.random() * WORDS.length)];
                    isReady = true;
                    messageElement.classList.remove("show");
                })
                .catch(err => {
                    showMessage("Fehler beim Laden der Wörter!", 0);
                });
        }, 100);

        document.addEventListener("keydown", (e) => {
            if (gameOver || !isReady) return;
            const key = e.key;
            if (key === "Backspace") handleKey('backspace');
            else if (key === "Enter") handleKey('enter');
            else if (/^[a-zäöüß]$/i.test(key)) handleKey(key.toLowerCase());
        });

        function handleKey(key) {
            if (gameOver || !isReady) return;
            const row = game.children[currentRow];

            // 8ms Vibration für Gboard Tasten-Feeling
            triggerVibration(8); 

            if (key === 'backspace') {
                if (currentCol > 0) {
                    currentCol--;
                    row.children[currentCol].textContent = "";
                    row.children[currentCol].classList.remove("filled");
                    guesses[currentRow] = guesses[currentRow].slice(0, -1);
                }
            } else if (key === 'enter') {
                if (currentCol === 5) submitGuess();
            } else if (/^[a-zäöüß]$/i.test(key) && currentCol < 5) {
                const tile = row.children[currentCol];
                tile.textContent = (key === 'ß') ? 'ß' : key.toUpperCase();
                tile.classList.add("filled");
                guesses[currentRow] += key.toLowerCase();
                currentCol++;
            }
        }

        function submitGuess() {
            const guess = guesses[currentRow];
            const row = game.children[currentRow];
            
            if (!WORDS.includes(guess)) {
                triggerVibration([20, 30, 20, 30, 30]); 
                for (let i = 0; i < 5; i++) {
                    row.children[i].classList.add("error");
                }
                setTimeout(() => {
                    for (let i = 0; i < 5; i++) {
                        row.children[i].classList.remove("error");
                    }
                }, 400); 
                return;
            }

            const targetLetters = targetWord.split("");
            const guessLetters = guess.split("");
            const status = Array(5).fill('absent');

            for (let i = 0; i < 5; i++) {
                if (guessLetters[i] === targetLetters[i]) {
                    status[i] = 'correct';
                    targetLetters[i] = null;
                }
            }
            
            for (let i = 0; i < 5; i++) {
                if (status[i] !== 'correct' && targetLetters.includes(guessLetters[i])) {
                    status[i] = 'present';
                    targetLetters[targetLetters.indexOf(guessLetters[i])] = null;
                }
            }

            for (let i = 0; i < 5; i++) {
                const tile = row.children[i];
                const s = status[i];
                
                setTimeout(() => {
                    tile.classList.add(s);
                    updateKeyColor(guessLetters[i], s);
                    
                    if (i === 4) {
                        if (guess === targetWord) { 
                            gameOver = true; 
                            triggerWinAnimation(row);
                            showMessage("Genial!", 0);
                            setTimeout(() => document.body.addEventListener('click', resetGame), 500);
                        }
                        else if (currentRow === 5) { 
                            gameOver = true; 
                            triggerLossAnimation();
                            let displayTarget = targetWord.toUpperCase();
                            if(targetWord.includes('ß')) displayTarget = targetWord.replace(/ß/gi, 'ß');
                            showMessage(displayTarget, 0); 
                            setTimeout(() => document.body.addEventListener('click', resetGame), 500);
                        }
                        else { 
                            currentRow++; 
                            currentCol = 0; 
                        }
                    }
                }, i * 200);
            }
        }

        function updateKeyColor(letter, status) {
            let key = document.querySelector(`[data-key="${letter.toLowerCase()}"]`);
            if (!key) return;

            const currentStatus = usedLetters[letter];
            if (!currentStatus) {
                usedLetters[letter] = status;
            } else if (currentStatus === 'correct') {
                return;
            } else if (currentStatus === 'present' && status === 'correct') {
                usedLetters[letter] = status;
            } else if (currentStatus === 'absent') {
                usedLetters[letter] = status;
            }

            key.classList.remove("correct", "present", "absent");
            key.classList.add(usedLetters[letter]);
        }

        function resetGame() {
            document.body.removeEventListener('click', resetGame);
            
            currentRow = 0;
            currentCol = 0;
            gameOver = false;
            guesses = ["", "", "", "", "", ""];
            usedLetters = {};
            targetWord = WORDS[Math.floor(Math.random() * WORDS.length)];
            
            flashOverlay.className = "";
            game.classList.remove("board-shake");

            const tiles = document.querySelectorAll('.tile');
            tiles.forEach(tile => {
                tile.textContent = '';
                tile.className = 'tile';
                tile.classList.remove('jump');
            });
            
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => {
                key.classList.remove('correct', 'present', 'absent');
            });
            
            messageElement.classList.remove("show");
        }
    </script>
</body>
</html>
